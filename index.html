<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerver költözés</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c2f33;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            background-color: #23272a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #4752c4;
            transform: scale(1.05);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">👋</div>
        <h1>Fontos üzenet! (csirke, vegánmacska)</h1>
        <p>
            Bizonyos okok miatt kiléptem az eddigi szerverből. 
            Szeretném, ha a közösség együtt maradna, ezért kérlek, csatlakozzatok az új helyre!
        </p>
        <a href="https://discord.gg/TWSzA5vxAR" class="btn" target="_blank">Csatlakozás az új szerverhez</a>
    </div>

</body>
</html>
